name: Build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew desktopTest 2>&1 | tee -a gradle.log

      - name: Build Android app
        run: ./gradlew :androidApp:assembleDebug 2>&1 | tee -a gradle.log

      - name: Build desktop app
        run: ./gradlew :desktopApp:jar 2>&1 | tee -a gradle.log

      # Surface the Gradle error as an annotation so it is readable without opening the full log.
      - name: Report Gradle failure
        if: failure()
        run: |
          details=$(grep -E -A 30 "What went wrong|^e: " gradle.log | head -100)
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Gradle failure::${details}"
